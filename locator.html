<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital &amp; Ambulance Map - Emergency Healthcare Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="locator">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-nav"></header>

  <main id="main" class="container py-3">
    <h1 class="page-title">Hospitals and ambulances near you</h1>

    <div class="panel mb-3" id="locationBox"></div>

    <div class="panel mb-3">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <fieldset>
          <legend class="visually-hidden">Show</legend>
          <div class="btn-group" role="group" aria-label="Show hospitals, ambulances or both">
            <input type="radio" class="btn-check" name="layer" id="layerAll" value="all" checked>
            <label class="btn btn-outline-dark" for="layerAll">Both</label>
            <input type="radio" class="btn-check" name="layer" id="layerHospital" value="hospital">
            <label class="btn btn-outline-dark" for="layerHospital">Hospitals</label>
            <input type="radio" class="btn-check" name="layer" id="layerAmbulance" value="ambulance">
            <label class="btn btn-outline-dark" for="layerAmbulance">Ambulances</label>
          </div>
        </fieldset>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="onlyAvailable">
          <label class="form-check-label" for="onlyAvailable">Hide unavailable</label>
        </div>
      </div>
    </div>

    <p class="small text-secondary" id="resultCount" role="status" aria-live="polite"></p>

    <div class="row g-3">
      <div class="col-lg-7 order-1 order-lg-2">
        <div class="map-sticky">
          <div id="map" class="map-box" role="application" aria-label="Map of nearby hospitals and ambulances"></div>
          <p align="center" class="small text-secondary mt-1 mb-0"> Google Map</p>
        </div>
      </div>
      <div class="col-lg-5 order-2 order-lg-1">
        <div id="locatorList" class="locator-list"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6RobzbwRVhenTdUwADcixJ7LN21Hxlxo"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/locator.js"></script>
</body>
</html>
