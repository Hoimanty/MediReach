<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blood Availability Board - Emergency Healthcare Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="blood">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-nav"></header>

  <main id="main" class="container py-4">
    <h1 class="page-title"><i class="bi bi-droplet-fill text-danger" aria-hidden="true"></i> Blood availability</h1>

    <div class="row g-3 mb-3">
      <div class="col-lg-8">
        <div class="panel h-100">
          <fieldset class="mb-3">
            <legend class="form-label small mb-1">Blood group</legend>
            <div class="btn-group flex-wrap group-picker" role="group" aria-label="Blood group filter" id="groupPicker"></div>
          </fieldset>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="inStockOnly" checked>
            <label class="form-check-label" for="inStockOnly">Only show blood banks that have it in stock</label>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="panel h-100" id="locationBox"></div>
      </div>
    </div>

    <p class="small text-secondary" id="resultCount" role="status" aria-live="polite"></p>
    <div class="legend small mb-3">
      <span class="tile-key tile-ok"></span> 10+ units (good)
      <span class="tile-key tile-low ms-3"></span> 1-9 units (low)
      <span class="tile-key tile-none ms-3"></span> 0 units (out)
    </div>
    <div id="bloodArea"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/blood.js"></script>
</body>
</html>
