<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Service - Emergency Healthcare Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="search">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-nav"></header>

  <main id="main" class="container py-4">
    <h1 class="page-title">Find a service</h1>

    <!-- Service switcher: clicking re-generates the form below without reloading the page -->
    <div class="service-pills mb-3" id="servicePills" role="group" aria-label="Choose a service"></div>

    <div class="row g-4">
      <div class="col-lg-7 order-2 order-lg-1">
        <form id="searchForm" class="card form-card" novalidate>
          <div class="card-body p-4">
            <h2 class="h4 d-flex align-items-center gap-2" id="formTitle"></h2>
            <p class="text-secondary" id="formHint"></p>
            <div id="dynamicFields"></div>
            <button type="submit" class="btn btn-danger btn-lg w-100 mt-3"><i class="bi bi-search" aria-hidden="true"></i> Search nearest available</button>
          </div>
        </form>
      </div>
      <div class="col-lg-5 order-1 order-lg-2">
        <div class="panel" id="locationBox"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
