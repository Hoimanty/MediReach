<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Results - Emergency Healthcare Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="results">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-nav"></header>

  <main id="main" class="container py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
      <div>
        <h1 class="page-title mb-1" id="resultsTitle">Results</h1>
        <p class="text-secondary mb-0" id="resultsSummary"></p>
      </div>
      <a class="btn btn-outline-dark" id="modifySearch" href="search.html"><i class="bi bi-pencil" aria-hidden="true"></i> Change search</a>
    </div>

    <!-- Main controls: sort + hide unavailable. Extra filters are tucked into "More filters". -->
    <div class="panel mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-7">
          <label class="form-label small mb-1" for="sortSelect">Sort by</label>
          <select class="form-select" id="sortSelect">
            <option value="smart">Available first, then nearest</option>
            <option value="nearest">Nearest to farthest</option>
            <option value="farthest">Farthest to nearest</option>
          </select>
        </div>
        <div class="col-12 col-sm-5">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" id="onlyAvailable">
            <label class="form-check-label" for="onlyAvailable">Hide unavailable</label>
          </div>
        </div>
      </div>
      <details class="mt-2">
        <summary class="small">More filters</summary>
        <div class="row g-2 mt-1">
          <div class="col-12 col-sm-6">
            <label class="form-label small mb-1" for="nameSearch">Search by name</label>
            <input type="search" class="form-control" id="nameSearch" placeholder="e.g. Uttara">
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label small mb-1" for="maxDistance">Distance</label>
            <select class="form-select" id="maxDistance">
              <option value="0">Any distance</option>
              <option value="3">Within 3 km</option>
              <option value="5">Within 5 km</option>
              <option value="10">Within 10 km</option>
            </select>
          </div>
        </div>
      </details>
    </div>

    <p class="small text-secondary" id="resultCount" role="status" aria-live="polite"></p>

    <div class="row g-3">
      <!-- On phones the map comes first (small), on large screens it stays beside the list -->
      <div class="col-lg-6 order-1 order-lg-2">
        <div class="map-sticky">
          <div id="map" class="map-box map-box-sm" role="application" aria-label="Map of the results"></div>
          <p class="small text-secondary mt-1 mb-0">Google Map </p>
        </div>
      </div>
      <div class="col-lg-6 order-2 order-lg-1" id="resultsArea"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6RobzbwRVhenTdUwADcixJ7LN21Hxlxo"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
